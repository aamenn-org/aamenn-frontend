name: Deploy Frontend to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Development

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /var/www/aamenn-frontend
            git fetch origin main
            git reset --hard origin/main
            
            # Stop existing frontend container
            docker stop aamenn-frontend 2>/dev/null || true
            docker rm aamenn-frontend 2>/dev/null || true
            
            # Build new image
            docker build -t aamenn-frontend:latest .
            
            # Start new container on port 8081 (internal port)
            docker run -d \
              --name aamenn-frontend \
              --network aamenn-backend_default \
              -p 8081:8081 \
              --restart unless-stopped \
              aamenn-frontend:latest
            
            # Wait for frontend to be ready
            sleep 5
            
            # Show logs
            docker logs --tail=50 aamenn-frontend
            echo "Frontend deployed successfully: $(git rev-parse --short HEAD)"
